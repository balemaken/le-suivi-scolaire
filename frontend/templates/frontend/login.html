{%load static%}


<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SchoolConnect/login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{%static 'frontend/css/login.css'%}">
</head>
<body>
<section class="auth-section">
  <div class="auth-card">
    <span class="auth-eyebrow">Espace parent</span>
    <h1>Connexion à votre compte</h1>
    <p class="sub">Accédez au suivi scolaire de votre enfant en quelques secondes.</p>

    <form id="loginForm" novalidate>
      <div class="field-row">
        <div class="field">
          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom" placeholder="Ex : Balemaken" required>
        </div>
        <div class="field">
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" name="prenom" placeholder="Ex : Bale" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" placeholder="vous@exemple.com" required>
      </div>

      <div class="field field-pw">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
        <button type="button" class="toggle-pw" aria-label="Afficher le mot de passe" data-target="password">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
            <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <button type="submit" class="btn auth-submit">
        Se connecter
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>
          <path d="m13 6 6 6-6 6"></path>
        </svg>
      </button>
    </form>

    <p class="auth-switch">
      Vous n'avez pas encore de compte ?
      <a href="{% url 'inscription' %}">Cliquez ici pour vous inscrire</a>
    </p>
  </div>
</section>

<footer>
  <p>© 2026 SchoolConnect. Tous droits réservés.</p>
</footer>

<script>
  document.querySelectorAll('.toggle-pw').forEach(function(btn){
    btn.addEventListener('click', function(){
      var input = document.getElementById(btn.dataset.target);
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  });

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    // Emplacement prévu pour la logique d'authentification (appel API, etc.)
    alert('Connexion : à relier à votre backend.');
  });
</script>

</body>
</html>
