    </div>

    <nav>
      <a href="{% url 'pageparent' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>

      <a href="{% url 'mesnotes' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a1 1 0 0 1 1-1h11l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"></path><path d="M8 12h8M8 16h5"></path></svg>
        Notes &amp; bulletins
      </a>
      <a href="{% url 'madiscipline' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg>

      <a href="{% url 'leparametre' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path></svg>
        Paramètres

    <div class="logout">

        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>

  <!-- ===== MAIN ===== -->
  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <h1>Notifications</h1>
        <p class="sub">Toutes vos notifications récentes.</p>
      </div>
      <div class="topbar-actions">
        <a href="#" class="icon-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
          <span class="dot"></span>
        </a>
        <a href="#" class="icon-btn" aria-label="Contacter l'école">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5Z"></path></svg>
        </a>
        <div class="topbar-avatar">
          <span class="avatar-sm" id="parent-initial">P</span>
          <span id="parent-nom">Parent</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Toutes les notifications</h2>
        <a href="#" id="mark-all-read">Tout marquer lu</a>
      </div>
      <div class="notif-list" id="notif-list">
        <!-- Généré par JS -->
      </div>
    </div>

  </main>
</div>

<script>
  (function() {
    const parentId = document.body.dataset.parentId;
    if (!parentId) return;

    async function fetchAPI(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    async function loadProfile() {
      try {
        const data = await fetchAPI(`/parents/${parentId}/`);
        document.getElementById('parent-nom').textContent = data.prenom || data.nom || 'Parent';
        document.getElementById('parent-initial').textContent = (data.prenom || data.nom || 'P')[0];
      } catch (e) { console.warn('Profil:', e); }
    }

    async function loadNotifications() {
      const container = document.getElementById('notif-list');
      container.innerHTML = '<div class="notif-item"><div><p>Chargement...</p></div></div>';

      try {
        // Récupérer tous les enfants
        const enfants = await fetchAPI(`/parents/${parentId}/eleves/`);
        if (!enfants || enfants.length === 0) {
          container.innerHTML = '<div class="notif-item"><div><p>Aucun enfant rattaché.</p></div></div>';
          return;
        }

        let allNotifs = [];

        // Pour chaque enfant, on va chercher les remarques, absences et sanctions
        for (const enfant of enfants) {
          try {
            const suivi = await fetchAPI(`/parents/${parentId}/eleves/${enfant.id_eleve}/suivi/`);
            const remarques = (suivi.remarques || []).map(r => ({
              type: 'Remarque',
              date: r.date || new Date(),
              message: `${r.contenu || 'Remarque'} — ${enfant.nom}`,
              icon: 'sage',
              svg: '<path d="M4 19V5a1 1 0 0 1 1-1h11l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"></path>'
            }));
            const absences = (suivi.absences || []).map(a => ({
              type: 'Absence',
              date: a.date_absence || new Date(),
              message: `Absence le ${new Date(a.date_absence).toLocaleDateString('fr-FR')} — ${enfant.nom}`,
              icon: 'coral',
              svg: '<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path>'
            }));
            const sanctions = (suivi.sanctions || []).map(s => ({
              type: 'Sanction',
              date: s.date || new Date(),
              message: `Sanction : ${s.type_sanction || s.motif || ''} — ${enfant.nom}`,
              icon: 'ink',
              svg: '<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path>'
            }));
            allNotifs = [...allNotifs, ...remarques, ...absences, ...sanctions];
          } catch (e) {
            console.warn(`Erreur pour l'enfant ${enfant.id_eleve}`, e);
          }
        }

        // Trier par date décroissante
        allNotifs.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (allNotifs.length === 0) {
          container.innerHTML = '<div class="notif-item"><div><p>Aucune notification.</p></div></div>';
          document.getElementById('notif-badge').textContent = '0';
          return;
        }

        document.getElementById('notif-badge').textContent = allNotifs.length;

        container.innerHTML = '';
        allNotifs.forEach(notif => {
          const div = document.createElement('div');
          div.className = `notif-item unread`;
          const dateStr = notif.date ? new Date(notif.date).toLocaleString('fr-FR') : '--';
          div.innerHTML = `
            <span class="ic" style="background:var(--${notif.icon});">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">${notif.svg}</svg>
            </span>
            <div>
              <p>${notif.message}</p>
              <small>${dateStr}</small>
            </div>
          `;
          container.appendChild(div);
        });

      } catch (e) {
        container.innerHTML = '<div class="notif-item"><div><p>Erreur de chargement des notifications.</p></div></div>';
        console.error(e);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadProfile();
      loadNotifications();
    });

  })();
</script>

</body>
</html>
