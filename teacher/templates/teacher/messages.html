{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — Espace enseignant — SchoolConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'teacher/css/pageteacher.css' %}" />
  <style>
    .badge-dot { margin-left: auto; background: var(--coral); color: var(--cream); font-size: 0.68rem; font-weight: 700; min-width: 19px; height: 19px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    .msg-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .msg-item:last-child { border-bottom: none; }
    .msg-item .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; flex-shrink: 0; font-family: 'Fraunces', serif; font-size: 1rem; }
    .msg-item .content { flex: 1; }
    .msg-item .content .expediteur { font-weight: 600; }
    .msg-item .content .date { font-size: 0.78rem; color: var(--text-soft); }
    .msg-item .content .message { margin-top: 4px; }
    .msg-item.unread { background: color-mix(in srgb, var(--accent) 6%, transparent); margin: 0 -16px; padding: 14px 16px; border-radius: 12px; }
    .msg-item .actions { display: flex; gap: 6px; align-items: center; }
    .msg-item .actions button { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 0.75rem; }
    .msg-item .actions button:hover { background: var(--cream); }
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 16px; }
    .form-grid input, .form-grid textarea { padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); font-family: 'Work Sans', sans-serif; font-size: 0.9rem; }
    .form-grid input:focus, .form-grid textarea:focus { outline: none; border-color: var(--accent); }
    .empty-state { text-align: center; padding: 30px 0; color: var(--text-soft); }

    /* 🔥 DÉCONNEXION — placement propre du bouton en bas de la sidebar */
    .sidebar { display: flex; flex-direction: column; }
    .sidebar nav { flex: 1 1 auto; }
    .sidebar .logout {
      margin-top: auto;
      padding: 14px 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar .logout a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .sidebar .logout a:hover {
      background: rgba(217, 68, 68, 0.15);
      color: #ff8a8a;
    }
    .sidebar .logout svg {
      width: 18px; height: 18px;
      stroke: currentColor;
      flex-shrink: 0;
    }
    .sidebar .logout a.loading {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="dash-body">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#D9A441" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /></svg></span>SchoolConnect</div>
    <nav>
      <a href="{% url 'pageteacher' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Tableau de bord</a>
      <a href="{% url 'classes' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 9h17"/></svg>Mes classes</a>
      <a href="{% url 'notes' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a1 1 0 0 1 1-1h11l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M8 12h8M8 16h5"/></svg>Saisie des notes</a>
      <a href="{% url 'élève' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.4 2.9-5.8 6.5-5.8s6.5 2.4 6.5 5.8"/><circle cx="17.5" cy="8.5" r="2.4"/><path d="M15.8 14.3c2.9.4 5.2 2.5 5.2 5.7"/></svg>Élèves</a>
      <a href="{% url 'absences' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>Absences</a>
      <a href="{% url 'sanctions' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>Sanctions</a>
      <a href="{% url 'bulletins' %}" class=""><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Bulletins</a>
      <a href="{% url 'remarques' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5Z"/></svg>Remarques</a>
      <a href="{% url 'messages' %}" class="active"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5Z"/></svg>Messages<span class="badge-dot" id="msg-badge">0</span></a>
      <a href="{% url 'parametre' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8-2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Paramètres</a>
    </nav>
    <div class="logout">
      <a href="#" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Déconnexion
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="dash-main">
    <div class="dash-topbar">
      <div><h1>Messages</h1><p class="sub">Tous vos messages.</p></div>
      <div class="topbar-avatar">
        <span class="avatar-sm" id="enseignant-initial">E</span>
        <span id="enseignant-nom-avatar">Enseignant</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Boîte de réception</h2>
        <button class="btn btn-sm" id="markAllRead" style="background:var(--sage);color:white;">✅ Tout marquer lu</button>
      </div>
      <div id="messagesList"></div>
    </div>

    <div class="panel" style="margin-top:20px;">
      <div class="panel-head"><h2>Envoyer un message</h2></div>
      <div class="form-grid">
        <input type="text" id="destinataire" placeholder="Destinataire (ex: Mme Mballa)">
        <textarea id="msgContent" rows="3" placeholder="Votre message..."></textarea>
        <button class="btn btn-sm" id="sendMsgBtn" style="background:var(--accent);">📤 Envoyer</button>
      </div>
    </div>
  </main>
</div>

<script>
  (function() {
    // ======================================================
    // 1. CONFIGURATION
    // ======================================================
    const API_BASE = '';
    const token = localStorage.getItem('authToken');
    const userNom = localStorage.getItem('userNom') || '';
    const userPrenom = localStorage.getItem('userPrenom') || '';
    const userRole = localStorage.getItem('userRole') || '';

    // 🔥 SÉCURITÉ — vérification connexion
    if (!token || userRole !== 'enseignant') {
      console.warn('⚠️ Non connecté en tant qu\'enseignant');
      window.location.replace('/login/');
      return;
    }

    // ======================================================
    // 2. AFFICHER LE NOM DE L'ENSEIGNANT
    // ======================================================
    function afficherProfil() {
      const nomComplet = (userPrenom + ' ' + userNom).trim() || 'Enseignant';
      document.getElementById('enseignant-nom-avatar').textContent = nomComplet;
      document.getElementById('enseignant-initial').textContent =
        (userPrenom || userNom).charAt(0).toUpperCase() || 'E';
    }

    // ======================================================
    // 3. DONNÉES (frontend uniquement, décommente ici pour tester)
    // ======================================================
    // 🔥 CORRECTION : la variable était commentée mais utilisée plus bas → bug
    let messages = [
      { id: 1, expediteur: 'Mme Mballa (parent)', message: 'Question sur le devoir de Sarah', date: 'Il y a 1 heure', lu: false },
      { id: 2, expediteur: 'Administration', message: 'Rappel saisie des notes', date: 'Hier', lu: false },
      { id: 3, expediteur: 'M. Tchoffo', message: 'Réunion demain 14h', date: 'Il y a 2 jours', lu: true }
    ];

    // ======================================================
    // 4. AFFICHER LES MESSAGES
    // ======================================================
    function renderMessages() {
      const container = document.getElementById('messagesList');
      if (messages.length === 0) {
        container.innerHTML = '<div class="empty-state">Aucun message.</div>';
        document.getElementById('msg-badge').textContent = '0';
        return;
      }

      container.innerHTML = '';
      const colors = ['var(--accent)', 'var(--sage)', 'var(--coral)', 'var(--gold)', 'var(--blue)'];

      messages.forEach(msg => {
        const div = document.createElement('div');
        div.className = `msg-item${msg.lu ? '' : ' unread'}`;
        div.innerHTML = `
          <div class="avatar" style="background:${colors[msg.id % colors.length]};">${msg.expediteur.charAt(0)}</div>
          <div class="content">
            <div style="display:flex;justify-content:space-between;flex-wrap:wrap;">
              <span class="expediteur">${msg.expediteur}</span>
              <span class="date">${msg.date}</span>
            </div>
            <div class="message">${msg.message}</div>
          </div>
          <div class="actions">
            <button onclick="toggleLu(${msg.id})">${msg.lu ? '📩 Non lu' : '✅ Lu'}</button>
            <button onclick="deleteMsg(${msg.id})" style="color:var(--coral);">🗑️</button>
          </div>
        `;
        container.appendChild(div);
      });

      document.getElementById('msg-badge').textContent = messages.filter(m => !m.lu).length;
    }

    // ======================================================
    // 5. ACTIONS SUR LES MESSAGES
    // ======================================================
    window.toggleLu = function(id) {
      const msg = messages.find(m => m.id === id);
      if (msg) { msg.lu = !msg.lu; renderMessages(); }
    };

    window.deleteMsg = function(id) {
      if (!confirm('Supprimer ce message ?')) return;
      messages = messages.filter(m => m.id !== id);
      renderMessages();
    };

    // ======================================================
    // 6. TOUT MARQUER LU
    // ======================================================
    document.getElementById('markAllRead').addEventListener('click', function() {
      messages.forEach(m => m.lu = true);
      renderMessages();
    });

    // ======================================================
    // 7. ENVOYER UN MESSAGE (simulé)
    // ======================================================
    document.getElementById('sendMsgBtn').addEventListener('click', function() {
      const destinataire = document.getElementById('destinataire').value.trim();
      const content = document.getElementById('msgContent').value.trim();

      if (!destinataire || !content) {
        alert('Veuillez remplir tous les champs.');
        return;
      }

      messages.unshift({
        id: Date.now(),
        expediteur: 'Moi',
        message: `À ${destinataire} : ${content}`,
        date: 'À l\'instant',
        lu: false
      });

      document.getElementById('destinataire').value = '';
      document.getElementById('msgContent').value = '';
      renderMessages();
    });

    // ======================================================
    // 8. 🔥 DÉCONNEXION — universelle et robuste
    // ======================================================
    async function deconnecter() {
      const btn = document.getElementById('logoutBtn');

      if (!confirm('Voulez-vous vraiment vous déconnecter ?')) return;

      btn.classList.add('loading');

      // 1) Invalider le token côté serveur
      try {
        if (token) {
          await fetch('/api/deconnexion/', {
            method: 'POST',
            headers: {
              'Authorization': 'Token ' + token,
              'Content-Type': 'application/json'
            }
          });
          console.log('✅ Token invalidé côté serveur');
        }
      } catch (err) {
        console.warn('⚠️ Serveur injoignable — nettoyage client quand même :', err);
      }

      // 2) Nettoyer TOUT le stockage local
      try {
        localStorage.clear();
        sessionStorage.clear();
      } catch (e) {
        console.warn('Erreur nettoyage stockage :', e);
      }

      // 3) Redirection (replace = pas de retour arrière possible)
      window.location.replace('/login/');
    }

    document.getElementById('logoutBtn').addEventListener('click', function(e) {
      e.preventDefault();
      deconnecter();
    });

    // ======================================================
    // 9. INITIALISATION
    // ======================================================
    document.addEventListener('DOMContentLoaded', function() {
      afficherProfil();
      renderMessages();
    });

  })();
</script>
</body>
</html>
