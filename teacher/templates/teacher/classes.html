{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes classes — Espace enseignant — SchoolConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'teacher/css/pageteacher.css' %}" />
  <style>
    .badge-dot { margin-left: auto; background: var(--coral); color: var(--cream); font-size: 0.68rem; font-weight: 700; min-width: 19px; height: 19px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    .classe-card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 20px 24px; margin-bottom: 16px; transition: transform 0.2s, box-shadow 0.2s; }
    .classe-card:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -12px rgba(28,46,51,0.15); }
    .classe-card .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .classe-card .header h3 { font-size: 1.15rem; font-weight: 700; }
    .classe-card .matieres { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .classe-card .matiere-tag { background: var(--cream); padding: 4px 14px; border-radius: 999px; font-size: 0.82rem; border: 1px solid var(--line); font-weight: 500; }
    .classe-card .infos { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .classe-card .infos .eleves { color: var(--text-soft); font-size: 0.9rem; }
    .classe-card .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .classe-card .actions .btn-sm { padding: 8px 18px; font-size: 0.82rem; border-radius: 999px; border: none; font-weight: 600; cursor: pointer; transition: transform 0.2s, background 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .classe-card .actions .btn-sm:hover { transform: translateY(-2px); }
    .btn-notes { background: var(--accent); color: var(--ink); }
    .btn-notes:hover { background: var(--accent-dark); }
    .btn-eleves { background: var(--sage); color: white; }
    .btn-eleves:hover { background: #5a7a5d; }
    .status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 999px; font-size: 0.76rem; font-weight: 700; }
    .status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
    .status-pill.on { background: rgba(110,143,113,0.15); color: var(--sage); }
    .status-pill.on::before { background: var(--sage); }
    .status-pill.wait { background: rgba(217,164,65,0.18); color: #a97416; }
    .status-pill.wait::before { background: var(--gold); }
  </style>
</head>
<body data-enseignant-id="1">

<div class="dash-body">

  <!-- ===== SIDEBAR (identique) ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#D9A441" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /></svg></span>SchoolConnect</div>
    <nav>
      <a href="{% url 'pageteacher' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Tableau de bord</a>
      <a href="{% url 'classes' %}" class="active"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 9h17"/></svg>Mes classes</a>
      <a href="{% url 'notes' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a1 1 0 0 1 1-1h11l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M8 12h8M8 16h5"/></svg>Saisie des notes</a>
      <a href="{% url 'élève' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.4 2.9-5.8 6.5-5.8s6.5 2.4 6.5 5.8"/><circle cx="17.5" cy="8.5" r="2.4"/><path d="M15.8 14.3c2.9.4 5.2 2.5 5.2 5.7"/></svg>Élèves</a>
      <a href="{% url 'absences' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>Absences</a>
      <a href="{% url 'sanctions' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>Sanctions</a>
      <a href="{% url 'remarques' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5Z"/></svg>Remarques</a>
      <a href="{% url 'messages' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5Z"/></svg>Messages<span class="badge-dot" id="msg-badge">3</span></a>
      <a href="{% url 'parametre' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8-2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Paramètres</a>
    </nav>
    <div class="logout"><a href=""><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Déconnexion</a></div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="dash-main">
    <div class="dash-topbar"><div><h1>Mes classes</h1><p class="sub">Liste des classes et matières qui vous sont affectées.</p></div><div class="topbar-avatar"><span class="avatar-sm" id="enseignant-initial">N</span><span id="enseignant-nom-avatar">M. Ngono</span></div></div>
    <div id="classesContainer"></div>
  </main>
</div>

<script>
  (function() {
    const affectations = [
      { classe: { id: 1, nom: '5ᵉ A' }, matieres: [{ id: 1, nom: 'Mathématiques' }, { id: 2, nom: 'Physique' }], nbEleves: 34, statutNotes: 'À jour' },
      { classe: { id: 2, nom: '4ᵉ B' }, matieres: [{ id: 3, nom: 'Mathématiques' }], nbEleves: 31, statutNotes: 'En attente' },
      { classe: { id: 3, nom: '3ᵉ A' }, matieres: [{ id: 4, nom: 'Mathématiques' }, { id: 5, nom: 'Informatique' }], nbEleves: 29, statutNotes: 'À jour' }
    ];

    document.getElementById('enseignant-initial').textContent = 'N';
    document.getElementById('enseignant-nom-avatar').textContent = 'M. Ngono';

    const container = document.getElementById('classesContainer');
    affectations.forEach(a => {
      const card = document.createElement('div');
      card.className = 'classe-card';
      const statusClass = a.statutNotes === 'À jour' ? 'status-pill on' : 'status-pill wait';
      card.innerHTML = `
        <div class="header"><h3>${a.classe.nom}</h3><span class="${statusClass}">${a.statutNotes}</span></div>
        <div class="matieres">${a.matieres.map(m => `<span class="matiere-tag">${m.nom}</span>`).join('')}</div>
        <div class="infos"><span class="eleves">👨‍🎓 <strong>${a.nbEleves}</strong> élèves</span></div>
        <div class="actions">
          <a href="{% url 'notes' %}?classe=${a.classe.id}" class="btn-sm btn-notes">📝 Saisir notes</a>
          <a href="{% url 'élève' %}?classe=${a.classe.id}" class="btn-sm btn-eleves">👨‍🎓 Voir élèves</a>
          <a href="{% url 'absences' %}?classe=${a.classe.id}" class="btn-sm" style="background:var(--coral);color:white;">📋 Absences</a>
          <a href="{% url 'sanctions' %}?classe=${a.classe.id}" class="btn-sm" style="background:var(--blue);color:white;">⚠️ Sanctions</a>
        </div>
      `;
      container.appendChild(card);
    });
    document.getElementById('msg-badge').textContent = '3';
  })();
</script>
</body>
</html>
