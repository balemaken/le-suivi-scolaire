{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Élèves — Espace enseignant — SchoolConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'teacher/css/pageteacher.css' %}" />
  <style>
    .badge-dot { margin-left: auto; background: var(--coral); color: var(--cream); font-size: 0.68rem; font-weight: 700; min-width: 19px; height: 19px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; padding: 16px 20px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; align-items: center; }
    .filter-bar select { padding: 10px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--cream); font-family: 'Work Sans', sans-serif; font-size: 0.9rem; min-width: 160px; flex: 1; max-width: 220px; }
    .filter-bar select:focus { outline: none; border-color: var(--accent); background: var(--paper); }
    .filter-bar .btn-filter { padding: 10px 24px; border-radius: 999px; background: var(--sage); color: white; border: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: background 0.2s, transform 0.2s; }
    .filter-bar .btn-filter:hover { background: #5a7a5d; transform: translateY(-2px); }
    .eleve-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .eleve-item:last-child { border-bottom: none; }
    .eleve-item .nom { font-weight: 600; }
    .eleve-item .classe { color: var(--text-soft); font-size: 0.85rem; }
    .eleve-item .sexe { padding: 2px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
    .eleve-item .sexe.F { background: rgba(226,114,91,0.15); color: var(--coral); }
    .eleve-item .sexe.M { background: rgba(74,111,165,0.15); color: var(--blue); }
    .actions a { padding: 4px 12px; border-radius: 8px; font-size: 0.8rem; background: var(--cream); border: 1px solid var(--line); margin-left: 6px; text-decoration: none; }
    .actions a:hover { background: var(--accent); color: var(--paper); }
    .empty-state { text-align: center; padding: 30px 0; color: var(--text-soft); }
  </style>
</head>
<body data-enseignant-id="1">

<div class="dash-body">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#D9A441" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /></svg></span>SchoolConnect</div>
    <nav>
      <a href="{% url 'pageteacher' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Tableau de bord</a>
      <a href="{% url 'classes' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 9h17"/></svg>Mes classes</a>
      <a href="{% url 'notes' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a1 1 0 0 1 1-1h11l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M8 12h8M8 16h5"/></svg>Saisie des notes</a>
      <a href="{% url 'élève' %}" class="active"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.4 2.9-5.8 6.5-5.8s6.5 2.4 6.5 5.8"/><circle cx="17.5" cy="8.5" r="2.4"/><path d="M15.8 14.3c2.9.4 5.2 2.5 5.2 5.7"/></svg>Élèves</a>
      <a href="{% url 'absences' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>Absences</a>
      <a href="{% url 'sanctions' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>Sanctions</a>
      <a href="{% url 'remarques' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5Z"/></svg>Remarques</a>
      <a href="{% url 'messages' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5Z"/></svg>Messages<span class="badge-dot" id="msg-badge">3</span></a>
      <a href="{% url 'parametre' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8-2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Paramètres</a>
    </nav>
    <div class="logout"><a href=""><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Déconnexion</a></div>
  </aside>

  <!-- MAIN -->
  <main class="dash-main">
    <div class="dash-topbar"><div><h1>Élèves</h1><p class="sub">Liste des élèves de vos classes affectées.</p></div><div class="topbar-avatar"><span class="avatar-sm" id="enseignant-initial">N</span><span id="enseignant-nom-avatar">M. Ngono</span></div></div>

    <div class="filter-bar">
      <select id="classeFilter"><option value="">Toutes les classes</option></select>
      <button class="btn-filter" id="filterBtn">🔍 Filtrer</button>
    </div>

    <div class="panel"><div class="panel-head"><h2>Liste des élèves</h2></div><div id="elevesList"></div></div>
  </main>
</div>

<script>
  (function() {
    const affectations = [
      { classe: { id: 1, nom: '5ᵉ A' }, eleves: [{ id: 1, nom: 'Sarah Mballa', sexe: 'F' }, { id: 2, nom: 'Paul Mballa', sexe: 'M' }, { id: 3, nom: 'Marie Ngono', sexe: 'F' }] },
      { classe: { id: 2, nom: '4ᵉ B' }, eleves: [{ id: 4, nom: 'Jean Tchoffo', sexe: 'M' }, { id: 5, nom: 'Aline Nana', sexe: 'F' }] },
      { classe: { id: 3, nom: '3ᵉ A' }, eleves: [{ id: 6, nom: 'David Mballa', sexe: 'M' }, { id: 7, nom: 'Céline Ngono', sexe: 'F' }] }
    ];

    document.getElementById('enseignant-initial').textContent = 'N';
    document.getElementById('enseignant-nom-avatar').textContent = 'M. Ngono';

    const classeFilter = document.getElementById('classeFilter');
    affectations.forEach(a => { const opt = document.createElement('option'); opt.value = a.classe.id; opt.textContent = a.classe.nom; classeFilter.appendChild(opt); });

    document.getElementById('filterBtn').addEventListener('click', function() {
      const classeId = parseInt(classeFilter.value);
      const container = document.getElementById('elevesList');
      let eleves = [];
      affectations.forEach(a => {
        if (classeId && a.classe.id !== classeId) return;
        eleves = eleves.concat(a.eleves.map(e => ({ ...e, classe: a.classe.nom })));
      });
      if (eleves.length === 0) { container.innerHTML = '<div class="empty-state">Aucun élève trouvé.</div>'; return; }
      container.innerHTML = '';
      eleves.forEach(e => {
        const div = document.createElement('div');
        div.className = 'eleve-item';
        div.innerHTML = `<div><span class="nom">${e.nom}</span> <span class="classe">(${e.classe})</span> <span class="sexe ${e.sexe}">${e.sexe === 'F' ? 'Féminin' : 'Masculin'}</span></div><div class="actions"><a href="{% url 'notes' %}?eleve=${e.id}">📝 Notes</a></div>`;
        container.appendChild(div);
      });
    });
    document.getElementById('filterBtn').click();
    document.getElementById('msg-badge').textContent = '3';
  })();
</script>
</body>
</html>
