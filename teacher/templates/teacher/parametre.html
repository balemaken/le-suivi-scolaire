{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paramètres — Espace enseignant — SchoolConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'teacher/css/pageteacher.css' %}" />
  <style>
    .badge-dot { margin-left: auto; background: var(--coral); color: var(--cream); font-size: 0.68rem; font-weight: 700; min-width: 19px; height: 19px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    .field { margin-bottom: 18px; max-width: 480px; }
    .field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    .field input, .field select { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--cream); font-family: 'Work Sans', sans-serif; font-size: 0.95rem; transition: border-color 0.2s; }
    .field input:focus, .field select:focus { outline: none; border-color: var(--accent); background: var(--paper); }
    .field input:disabled { opacity: 0.7; cursor: not-allowed; }

    /* 🔥 DÉCONNEXION — placement propre du bouton en bas de la sidebar */
    .sidebar { display: flex; flex-direction: column; }
    .sidebar nav { flex: 1 1 auto; }
    .sidebar .logout {
      margin-top: auto;
      padding: 14px 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar .logout a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .sidebar .logout a:hover {
      background: rgba(217, 68, 68, 0.15);
      color: #ff8a8a;
    }
    .sidebar .logout svg {
      width: 18px; height: 18px;
      stroke: currentColor;
      flex-shrink: 0;
    }
    .sidebar .logout a.loading {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="dash-body">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#D9A441" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z" /><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" /></svg></span>SchoolConnect</div>
    <nav>
      <a href="{% url 'pageteacher' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Tableau de bord</a>
      <a href="{% url 'classes' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 9h17"/></svg>Mes classes</a>
      <a href="{% url 'notes' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a1 1 0 0 1 1-1h11l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M8 12h8M8 16h5"/></svg>Saisie des notes</a>
      <a href="{% url 'élève' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.4 2.9-5.8 6.5-5.8s6.5 2.4 6.5 5.8"/><circle cx="17.5" cy="8.5" r="2.4"/><path d="M15.8 14.3c2.9.4 5.2 2.5 5.2 5.7"/></svg>Élèves</a>
      <a href="{% url 'absences' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>Absences</a>
      <a href="{% url 'sanctions' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>Sanctions</a>
      <a href="{% url 'remarques' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5Z"/></svg>Remarques</a>
      <a href="{% url 'messages' %}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5Z"/></svg>Messages<span class="badge-dot" id="msg-badge">0</span></a>
      <a href="{% url 'parametre' %}" class="active"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8-2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Paramètres</a>
    </nav>
    <div class="logout">
      <a href="#" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Déconnexion
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="dash-main">
    <div class="dash-topbar">
      <div><h1>Paramètres</h1><p class="sub">Gérez vos informations personnelles.</p></div>
      <div class="topbar-avatar">
        <span class="avatar-sm" id="enseignant-initial">E</span>
        <span id="enseignant-nom-avatar">Enseignant</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Mon compte</h2></div>
      <form id="profileForm" novalidate>
        <div class="field"><label for="p-nom">Nom complet</label><input type="text" id="p-nom" placeholder="Votre nom complet"></div>
        <div class="field"><label for="p-email">Email</label><input type="email" id="p-email" placeholder="votre@email.com"></div>
        <div class="field"><label for="p-tel">Téléphone</label><input type="tel" id="p-tel" placeholder="+237 6XX XX XX XX"></div>
        <div class="field">
          <label for="p-sex">Sexe</label>
          <select id="p-sex">
            <option value="">-- Choisir --</option>
            <option value="M">Masculin</option>
            <option value="F">Féminin</option>
          </select>
        </div>
        <button type="submit" class="btn btn-sm">💾 Enregistrer</button>
      </form>
    </div>
  </main>
</div>

<script>
  (function() {
    // ======================================================
    // 1. CONFIGURATION
    // ======================================================
    const API_BASE = '';

    // ======================================================
    // 2. UTILISATEUR CONNECTÉ (localStorage)
    // ======================================================
    const token = localStorage.getItem('authToken');
    const userId = localStorage.getItem('userId');
    const userNom = localStorage.getItem('userNom') || '';
    const userPrenom = localStorage.getItem('userPrenom') || '';
    const userEmail = localStorage.getItem('userEmail') || '';
    const userRole = localStorage.getItem('userRole') || '';

    // 🔥 SÉCURITÉ — vérification connexion
    if (!token || !userId || userRole !== 'enseignant') {
      console.warn('⚠️ Non connecté en tant qu\'enseignant');
      window.location.replace('/login/');
      return;
    }

    // ======================================================
    // 3. FONCTION FETCH
    // ======================================================
    async function fetchAPI(url, options = {}) {
      const response = await fetch(API_BASE + url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Token ' + token,
          ...(options.headers || {})
        }
      });

      if (response.status === 204) return null;

      // 🔥 DÉCONNEXION — token invalide/expiré → nettoyage + redirection
      if (response.status === 401) {
        console.warn('⚠️ Token invalide ou expiré — nettoyage auto');
        localStorage.clear();
        sessionStorage.clear();
        window.location.replace('/login/');
        return null;
      }

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        const error = new Error('Erreur API');
        error.data = data;
        error.status = response.status;
        throw error;
      }
      return data;
    }

    // ======================================================
    // 4. AFFICHER LE NOM DE L'ENSEIGNANT
    // ======================================================
    function afficherProfil() {
      const nomComplet = (userPrenom + ' ' + userNom).trim() || 'Enseignant';
      document.getElementById('enseignant-nom-avatar').textContent = nomComplet;
      document.getElementById('enseignant-initial').textContent =
        (userPrenom || userNom).charAt(0).toUpperCase() || 'E';
    }

    // ======================================================
    // 5. PRÉREMPLIR LE FORMULAIRE
    // ======================================================
    function prefillForm() {
      const nomComplet = (userPrenom + ' ' + userNom).trim();
      document.getElementById('p-nom').value = nomComplet;
      document.getElementById('p-email').value = userEmail;
      // Téléphone et sexe ne sont pas dans le localStorage par défaut,
      // on les laisse vides (ou tu peux les stocker au login)
    }

    // ======================================================
    // 6. SOUMISSION DU FORMULAIRE (simulée pour l'instant)
    // ======================================================
    document.getElementById('profileForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Profil mis à jour avec succès ! (simulation)');
    });

    // ======================================================
    // 7. 🔥 DÉCONNEXION — universelle et robuste
    // ======================================================
    async function deconnecter() {
      const btn = document.getElementById('logoutBtn');

      if (!confirm('Voulez-vous vraiment vous déconnecter ?')) return;

      btn.classList.add('loading');

      // 1) Invalider le token côté serveur
      try {
        if (token) {
          await fetch('/api/deconnexion/', {
            method: 'POST',
            headers: {
              'Authorization': 'Token ' + token,
              'Content-Type': 'application/json'
            }
          });
          console.log('✅ Token invalidé côté serveur');
        }
      } catch (err) {
        console.warn('⚠️ Serveur injoignable — nettoyage client quand même :', err);
      }

      // 2) Nettoyer TOUT le stockage local
      try {
        localStorage.clear();
        sessionStorage.clear();
      } catch (e) {
        console.warn('Erreur nettoyage stockage :', e);
      }

      // 3) Redirection (replace = pas de retour arrière possible)
      window.location.replace('/login/');
    }

    document.getElementById('logoutBtn').addEventListener('click', function(e) {
      e.preventDefault();
      deconnecter();
    });

    // ======================================================
    // 8. INITIALISATION
    // ======================================================
    document.addEventListener('DOMContentLoaded', function() {
      afficherProfil();
      prefillForm();
      document.getElementById('msg-badge').textContent = '0';
    });

  })();
</script>
</body>
</html>
