{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription administrateur — SchoolConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'administrateur/css/inscription.css' %}" />
  <style>
    .error-message {
      color: #E2725B;
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }
    .error-message.visible {
      display: block;
    }
    .success-message {
      background: rgba(110, 143, 113, 0.12);
      border-left: 4px solid #6E8F71;
      color: #2E7D5E;
      font-size: 0.92rem;
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 14px;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .success-message.visible {
      display: block;
    }
    .success-message strong {
      color: #1C2E33;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn[disabled] {
      opacity: 0.7;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#D9A441" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 2 8l10 5 10-5-10-5Z"></path>
        <path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5"></path>
      </svg>
    </span>
    SchoolConnect
  </div>
</header>

<section class="auth-section">
  <div class="auth-card">
    <span class="auth-eyebrow">Espace administrateur</span>
    <h1>Créer un compte administrateur</h1>
    <p class="sub">Renseignez vos informations pour gérer l'établissement sur SchoolConnect.</p>

    <!-- Zone de messages -->
    <div id="formMessage" class="error-message"></div>
    <div id="formSuccess" class="success-message"></div>

    <form id="adminRegisterForm" novalidate>
      <div class="field-row">
        <div class="field">
          <label for="ad-nom">Nom</label>
          <input type="text" id="ad-nom" name="nom" placeholder="Ex : Biya" required />
        </div>
        <div class="field">
          <label for="ad-prenom">Prénom</label>
          <input type="text" id="ad-prenom" name="prenom" placeholder="Ex : Marie" required />
        </div>
      </div>

      <div class="field">
        <label for="ad-email">Adresse e-mail</label>
        <input type="email" id="ad-email" name="email" placeholder="vous@exemple.com" required />
      </div>

      <div class="field field-pw">
        <label for="ad-password">Mot de passe</label>
        <input type="password" id="ad-password" name="password" placeholder="••••••••" required />
        <button type="button" class="toggle-pw" aria-label="Afficher le mot de passe" data-target="ad-password">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
            <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <button type="submit" class="btn auth-submit" id="submitBtn">
        Créer mon compte
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>
          <path d="m13 6 6 6-6 6"></path>
        </svg>
      </button>
    </form>

    <p class="auth-switch">
      Vous avez déjà un compte ?
      <a href="{% url 'login' %}">Retour à la connexion</a>
    </p>
  </div>
</section>

<footer>
  <p>© 2026 SchoolConnect. Tous droits réservés.</p>
</footer>

<script>
  // ============================================================
  // AFFICHER / MASQUER LE MOT DE PASSE
  // ============================================================
  document.querySelectorAll('.toggle-pw').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var input = document.getElementById(btn.dataset.target);
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  });

  // ============================================================
  // SOUMISSION DU FORMULAIRE D'INSCRIPTION ADMIN
  // ============================================================
  document.getElementById('adminRegisterForm').addEventListener('submit', function(e) {
    e.preventDefault();

    var errorDiv = document.getElementById('formMessage');
    var successDiv = document.getElementById('formSuccess');
    var submitBtn = document.getElementById('submitBtn');

    // Réinitialiser les messages
    errorDiv.textContent = '';
    errorDiv.classList.remove('visible');
    successDiv.textContent = '';
    successDiv.classList.remove('visible');

    // Récupérer les valeurs
    var nom = document.getElementById('ad-nom').value.trim();
    var prenom = document.getElementById('ad-prenom').value.trim();
    var email = document.getElementById('ad-email').value.trim();
    var password = document.getElementById('ad-password').value;

    // Vérification
    if (!nom || !prenom || !email || !password) {
      errorDiv.textContent = 'Veuillez remplir tous les champs.';
      errorDiv.classList.add('visible');
      return;
    }

    if (password.length < 6) {
      errorDiv.textContent = 'Le mot de passe doit contenir au moins 6 caractères.';
      errorDiv.classList.add('visible');
      return;
    }

    // Payload : pas de matricule ni d'enfants → rôle 'admin' automatiquement
    var payload = {
      nom: nom,
      prenom: prenom,
      email: email,
      password: password
    };

    console.log('📤 Envoi admin:', payload);

    // Désactiver le bouton
    submitBtn.disabled = true;
    submitBtn.style.opacity = '0.7';

    // Appel API
    fetch('/api/inscription/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    })
    .then(function(response) {
      return response.json().then(function(data) {
        return { status: response.status, body: data };
      });
    })
    .then(function(result) {
      console.log('📥 Réponse:', result);

      if (result.status === 201) {
        // ✅ Succès
        const user = result.body.utilisateur;

        successDiv.innerHTML =
          '✅ <strong>Inscription réussie !</strong><br>' +
          'Bienvenue <strong>' + user.prenom + ' ' + user.nom + '</strong> 🛡️<br>' +
          '<small>Rôle : Administrateur · Redirection en cours...</small>';
        successDiv.classList.add('visible');

        // Rediriger vers la connexion après 2s
        setTimeout(function() {
          window.location.href = "{% url 'login' %}";
        }, 2000);

      } else {
        // ❌ Erreur
        var erreurs = '';
        if (typeof result.body === 'object') {
          for (var key in result.body) {
            var valeur = result.body[key];
            if (Array.isArray(valeur)) {
              erreurs += '• ' + key + ' : ' + valeur.join(', ') + '\n';
            } else {
              erreurs += '• ' + key + ' : ' + valeur + '\n';
            }
          }
        } else {
          erreurs = result.body;
        }
        errorDiv.textContent = '❌ ' + erreurs;
        errorDiv.classList.add('visible');

        // Réactiver le bouton
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
      }
    })
    .catch(function(error) {
      errorDiv.textContent = '❌ Erreur réseau : impossible de contacter le serveur.';
      errorDiv.classList.add('visible');
      console.error('Erreur:', error);

      // Réactiver le bouton
      submitBtn.disabled = false;
      submitBtn.style.opacity = '1';
    });
  });
</script>

</body>
</html>
