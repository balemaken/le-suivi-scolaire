{%load static%}


<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paramètres — SchoolConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{%static 'administrateur/css/parametre.css'%}">
</head>
<body>

<div class="dash-body">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#D9A441" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 2 8l10 5 10-5-10-5Z"></path>
          <path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5"></path>
        </svg>
      </span>
      SchoolConnect
    </div>

    <nav>
      <a href="{% url 'pageadmin' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>
        Tableau de bord
      </a>
      <a href="{% url 'élève' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M2.5 20c0-3.4 2.9-5.8 6.5-5.8s6.5 2.4 6.5 5.8"></path><circle cx="17.5" cy="8.5" r="2.4"></circle><path d="M15.8 14.3c2.9.4 5.2 2.5 5.2 5.7"></path></svg>
        Élèves
      </a>
      <a href="{% url 'enseignant' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"></path><path d="M8.5 4.2 9.5 3l1 1.2-1 1.1Z"></path></svg>
        Enseignants
      </a>
      <a href="{% url 'notesBulletin' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a1 1 0 0 1 1-1h11l4 4v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"></path><path d="M8 12h8M8 16h5"></path></svg>
        Notes &amp; bulletins
      </a>
      <a href="">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg>
        Discipline
      </a>
      <a href="{% url 'message' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5Z"></path></svg>
        Messages
        <span class="badge-dot">5</span>
      </a>
    </nav>

    <div class="logout">
      <a href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
        Déconnexion
      </a>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <h1>Paramètres</h1>
        <p class="sub">Informations générales de l'établissement.</p>
      </div>
      <div class="topbar-actions">
        <a href="{% url 'message' %}" class="icon-btn" aria-label="Messages">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5Z"></path></svg>
          <span class="dot"></span>
        </a>
        <div class="topbar-avatar">
          <span class="avatar-sm">A</span>
          <span>Administrateur</span>
        </div>
      </div>
    </div>


    <div class="panel settings-form">
      <div class="panel-head">
        <h2>Informations de l'établissement</h2>
      </div>
      <form novalidate>
        <div class="field">
          <label for="s-nom">Nom de l'établissement</label>
          <input type="text" id="s-nom" value="Collège Excellence — Yaoundé">
        </div>
        <div class="field">
          <label for="s-ville">Ville</label>
          <input type="text" id="s-ville" value="Yaoundé">
        </div>
        <div class="field">
          <label for="s-tel">Téléphone</label>
          <input type="tel" id="s-tel" placeholder="+237 6XX XX XX XX">
        </div>
        <div class="field">
          <label for="s-email">Email de contact</label>
          <input type="email" id="s-email" value="contact@schoolconnect.cm">
        </div>
        <button type="submit" class="btn btn-sm">Enregistrer les modifications</button>
      </form>
    </div>

  </main>
</div>

</body>
</html>
